<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف العبث والذكريات السنوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0b0b0f;
            color: #00ffcc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            z-index: 10;
        }

        .card {
            background: rgba(20, 20, 30, 0.95);
            border: 3px dashed #ff007f;
            border-radius: 25px;
            padding: 40px 25px;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.4);
            transform: rotate(-1deg);
            margin-bottom: 20px;
        }

        /* الشاشات */
        #lockScreen, #adminScreen, #mainContent {
            display: none;
        }

        #lockScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ff007f;
            margin-bottom: 15px;
            text-shadow: 2px 2px #00ffcc;
        }

        p {
            font-size: 1.1rem;
            color: #ffffff;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="password"], textarea {
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 12px;
            border: 2px solid #00ffcc;
            background: #121218;
            color: #fff;
            outline: none;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .btn {
            background: #ff007f;
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 900;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #99004c;
            transition: all 0.1s ease;
            margin: 5px;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #99004c;
        }

        .btn-secondary {
            background: #00ffcc;
            color: #121218;
            box-shadow: 0 5px 0 #00b386;
        }

        .btn-danger {
            background: #ff3333;
            box-shadow: 0 5px 0 #b30000;
            padding: 5px 15px;
            font-size: 0.9rem;
        }

        .error-msg {
            color: #ff3333;
            font-size: 1rem;
            font-weight: bold;
            display: none;
        }

        /* أزرار السنين */
        .years-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .year-btn {
            background: #1e1e2f;
            border: 2px solid #00ffcc;
            color: #fff;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .year-btn:hover {
            background: #00ffcc;
            color: #121218;
            transform: scale(1.05);
        }

        /* عرض رسالة السنة */
        .message-box {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ff007f;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.2rem;
            color: #ffeb3b;
            display: none;
        }

        /* جدول لوحة الإدارة */
        .admin-table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            text-align: right;
        }

        .admin-table th, .admin-table td {
            padding: 10px;
            border-bottom: 1px solid #333;
        }

        .admin-table th {
            color: #ff007f;
        }

        .admin-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        /* قلوب وبالونات طايرة */
        .floating-item {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp linear infinite;
            z-index: 1;
            user-select: none;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translateY(-110vh) scale(1.3) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. شاشة إدخال الباسورد (العامة أو الأدمن) -->
        <div id="lockScreen" class="card">
            <h1>🔒 منطقة محظورة وعيد ميلاد عبثي</h1>
            <p>أدخل الباسورد:</p>
            <input type="password" id="passwordInput" placeholder="اكتب الباسورد هنا...">
            <button class="btn" onclick="checkPassword()">دخول 🚀</button>
            <div id="errorMsg" class="error-msg">باسورد غلط يا حُب، حاول تاني! 🤡</div>
        </div>

        <!-- 2. لوحة التحكم (الأنظمة والأدمن) -->
        <div id="adminScreen" class="card">
            <h1>🛠️ لوحة تحكم الأدمن</h1>
            <p>أضف رسالة جديدة أو سنة جديدة:</p>
            <input type="text" id="newYearInput" placeholder="اكتب السنة (مثلاً: 2026 أو سنها 20)">
            <textarea id="newMessageInput" placeholder="اكتب الرسالة الخاصة بالسنة دي..."></textarea>
            <br>
            <button class="btn btn-secondary" onclick="addYearMessage()">حفظ وإضافة السنة 💾</button>
            
            <div style="max-height: 200px; overflow-y: auto; margin-top: 15px;">
                <table class="admin-table" id="adminTable">
                    <!-- سيتم تعبئتها ديناميكياً -->
                </table>
            </div>
            
            <div class="admin-actions">
                <button class="btn" onclick="logoutAdmin()">تسجيل خروج</button>
                <button class="btn btn-secondary" onclick="goToMain()">عرض الموقع 🌍</button>
            </div>
        </div>

        <!-- 3. الموقع الرئيسي (الخاص بيها) -->
        <div id="mainContent" class="card">
            <h1>🎉 أرشيف سنين المجنونة!</h1>
            <p>النهارده تمت 19 سنة من الضغط العالي والعبث العظيم! اختاري السنة عشان تشوفي الرسالة الخاصة بتاعتها:</p>
            
            <div class="years-grid" id="yearsGrid">
                <!-- أزرار السنين هتتولد هنا تلقائياً -->
            </div>

            <div id="displayMessage" class="message-box"></div>

            <div style="margin-top: 30px;">
                <button class="btn btn-secondary" onclick="openAdminFromMain()">دخول الأدمن ⚙️</button>
            </div>
        </div>
    </div>

    <script>
        // قاعدة البيانات الافتتاحية (السنة دي 19 سنة / 2026)
        let siteData = JSON.parse(localStorage.getItem('birthday_site_data')) || {
            "سنها 19 (2026)": "النهارده تمت 19 سنة، وكل سنة وأنتِ مجنوني المفضلة والسبب الرئيسي في الضغط العالي اللي عندي. عايشين مع بعض في أحلى عبث في التاريخ، ومن غيرك الدنيا كانت هتبقى طشاش! بحبك يا طيز 🍑❤️"
        };

        function saveData() {
            localStorage.setItem('birthday_site_data', JSON.stringify(siteData));
        }

        function checkPassword() {
            const pass = document.getElementById("passwordInput").value.trim();
            const errorDiv = document.getElementById("errorMsg");

            if (pass === "285206") {
                // دخول الأدمن
                document.getElementById("lockScreen").style.display = "none";
                document.getElementById("adminScreen").style.display = "block";
                renderAdminTable();
            } else if (pass === "8/11" || pass === "") { // تقدر تخليها أي باسورد عادي ليها أو تسيبها مفتوحة
                // دخول الموقع الرئيسي
                document.getElementById("lockScreen").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
                renderMainYears();
                startFloating();
            } else {
                errorDiv.style.display = "block";
            }
        }

        // --- وظائف الأدمن ---
        function addYearMessage() {
            const year = document.getElementById("newYearInput").value.trim();
            const msg = document.getElementById("newMessageInput").value.trim();

            if (!year || !msg) {
                alert("ملء الحقلين إجباري يا معلم!");
                return;
            }

            siteData[year] = msg;
            saveData();
            document.getElementById("newYearInput").value = "";
            document.getElementById("newMessageInput").value = "";
            renderAdminTable();
            alert("تمت الإضافة بنجاح يا باشا!");
        }

        function deleteYear(year) {
            if (confirm(`متأكد إنك عايز تمسح سنة ${year}؟`)) {
                delete siteData[year];
                saveData();
                renderAdminTable();
            }
        }

        function renderAdminTable() {
            const table = document.getElementById("adminTable");
            table.innerHTML = `<tr><th>السنة / المناسبة</th><th>الرسالة</th><th>تحكم</th></tr>`;
            for (let [year, msg] of Object.entries(siteData)) {
                table.innerHTML += `
                    <tr>
                        <td><b>${year}</b></td>
                        <td>${msg.substring(0, 30)}...</td>
                        <td><button class="btn btn-danger" onclick="deleteYear('${year}')">حذف</button></td>
                    </tr>
                `;
            }
        }

        function logoutAdmin() {
            document.getElementById("adminScreen").style.display = "none";
            document.getElementById("lockScreen").style.display = "flex";
            document.getElementById("passwordInput").value = "";
            document.getElementById("errorMsg").style.display = "none";
        }

        function goToMain() {
            document.getElementById("adminScreen").style.display = "none";
            document.getElementById("mainContent").style.display = "block";
            renderMainYears();
            startFloating();
        }

        function openAdminFromMain() {
            const pass = prompt("اكتب باسورد الأدمن يا معلم:");
            if (pass === "285206") {
                document.getElementById("mainContent").style.display = "none";
                document.getElementById("adminScreen").style.display = "block";
                renderAdminTable();
            } else if (pass !== null) {
                alert("باسورد غلط يا معلم!");
            }
        }

        // --- وظائف الموقع الرئيسي ---
        function renderMainYears() {
            const grid = document.getElementById("yearsGrid");
            grid.innerHTML = "";
            for (let year of Object.keys(siteData)) {
                const btn = document.createElement("button");
                btn.className = "year-btn";
                btn.innerHTML = `✨ ${year}`;
                btn.onclick = () => showYearMessage(year);
                grid.appendChild(btn);
            }
        }

        function showYearMessage(year) {
            const box = document.getElementById("displayMessage");
            box.style.display = "block";
            box.innerHTML = `<b>رسالة سنة ${year}:</b><br><br>${siteData[year]}`;
        }

        // تأثير القلوب والبالونات
        function createFloatingElement() {
            const item = document.createElement('div');
            item.classList.add('floating-item');
            
            const symbols = ['🎈', '❤️', '💖', '🎈', '💘', 'بحبك يا طيز 🍑'];
            const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
            
            if (randomSymbol.includes('بحبك')) {
                item.style.fontSize = '15px';
                item.style.color = '#ff007f';
                item.style.fontWeight = 'bold';
                item.style.background = 'rgba(0,0,0,0.85)';
                item.style.padding = '5px 10px';
                item.style.borderRadius = '10px';
                item.style.border = '1px solid #ff007f';
            } else {
                item.style.fontSize = (Math.random() * 25 + 15) + 'px';
            }

            item.innerHTML = randomSymbol;
            item.style.left = Math.random() * 90 + 5 + 'vw';
            item.style.animationDuration = (Math.random() * 3 + 3) + 's';
            
            document.body.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 6000);
        }

        function startFloating() {
            if (!window.floatingInterval) {
                window.floatingInterval = setInterval(createFloatingElement, 350);
            }
        }

        // ابدأ بعرض شاشة الباسورد عند فتح الموقع
        document.getElementById("lockScreen").style.display = "flex";
    </script>

</body>
</html>
